spring.application.name=backend

# Postgres: in Docker the values come from infra/docker-compose.yml; the defaults match docker-compose.dev.yml
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:cuymonitor}
spring.datasource.username=${DB_USER:cuymonitor}
spring.datasource.password=${DB_PASSWORD:cuymonitor}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=cuy-monitor-backend
spring.kafka.consumer.auto-offset-reset=earliest

# Shared key required in the X-API-Key header
app.api-key=${APP_API_KEY:dev-key}

# Only /actuator/health is exposed (Caddy forwards it)
management.endpoints.web.exposure.include=health
