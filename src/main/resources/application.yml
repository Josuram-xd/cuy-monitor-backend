spring:
  application:
    name: cuy-monitor-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cuymonitor}
    username: ${DB_USER:cuymonitor}
    password: ${DB_PASSWORD:cuymonitor}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    # cuy-monitor-db owns the schema (ADR-008); the backend only validates it
    enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # SMTP being down should not mark the backend as DOWN
    mail:
      enabled: false

app:
  api-key: ${APP_API_KEY:dev-key}
  auth:
    jwt:
      secret: ${APP_JWT_SECRET}
      issuer: cuy-monitor-backend
      # short on purpose: the refresh cookie renews it without asking for the code again
      ttl: 15m
    refresh:
      ttl: 7d
    cookie:
      # false only for plain http outside localhost
      secure: ${APP_COOKIE_SECURE:true}
    otp:
      ttl: 5m
      max-attempts: 5
      # at most 5 codes per account every 15 minutes
      max-requests: 5
      request-window: 15m
  mail:
    from: ${MAIL_FROM:no-reply@cuymonitor.local}
