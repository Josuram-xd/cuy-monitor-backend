spring:
  application:
    name: cuy-monitor-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cuymonitor}
    username: ${DB_USER:cuymonitor}
    password: ${DB_PASSWORD:cuymonitor}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  api-key: ${APP_API_KEY:dev-key}
  auth:
    jwt:
      secret: ${APP_JWT_SECRET}
      issuer: cuy-monitor-backend
      ttl: 30m
    otp:
      ttl: 5m
      max-attempts: 5
  mail:
    from: ${MAIL_FROM:no-reply@cuymonitor.local}
