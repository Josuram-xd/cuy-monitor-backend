spring:
  application:
    name: cuy-monitor-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cuymonitor}
    username: ${DB_USER:cuymonitor}
    password: ${DB_PASSWORD:cuymonitor}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    # cuy-monitor-db owns the schema (ADR-008); the backend only validates it
    enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # SMTP being down should not mark the backend as DOWN
    mail:
      enabled: false

app:
  api-key: ${APP_API_KEY:dev-key}
  auth:
    jwt:
      secret: ${APP_JWT_SECRET}
      issuer: cuy-monitor-backend
      # short on purpose: the refresh cookie renews it without asking for the code again
      ttl: 15m
    google:
      # public client id of the web app (Google Cloud Console > Credentials). Empty = Google sign-in is off.
      client-id: ${GOOGLE_CLIENT_ID:}
    refresh:
      ttl: 7d
    cookie:
      # false only for plain http outside localhost
      secure: ${APP_COOKIE_SECURE:true}
    otp:
      ttl: 5m
      max-attempts: 5
      # at most 5 codes per account every 15 minutes
      max-requests: 5
      request-window: 15m
  mail:
    from: ${MAIL_FROM:no-reply@cuymonitor.local}
  # thresholds of the health evaluation (HealthProperties); starting values, tuned with real data
  health:
    max-event-age: 10m
    min-detection-confidence: 0.5
    consecutive-anomaly-windows: 3
    distress-probability: 0.8
    # Task 10: an anomaly has to last this long at a level to go up; recovering takes several normal windows
    observed-to-alert: 30m
    alert-to-critical: 60m
    recovery-windows: 5
    # Task 11: what counts as anomalous, and how each guinea pig's normal profile is learned
    classifier-threshold: 0.7
    still-factor: 1.5
    group-distance-factor: 2.0
    baseline-min-samples: 30
    baseline-warmup-samples: 60
    # Task 12.2: the cage is getting lighter when the median of the stable readings of the last day is 10 % below
    # the median of the 6 days before (at least 5 stable readings in each)
    weight-drop-ratio: 0.1
    weight-recent-window: 24h
    weight-baseline-window: 6d
    weight-min-readings: 5
  # the help assistant of the dashboard (AssistantProperties). On the EC2 the Bedrock credentials come from the
  # instance role; ASSISTANT_ENABLED=false turns it off (the chat then says it is not available)
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    region: ${ASSISTANT_REGION:us-east-1}
    # Claude Haiku 4.5: open access in Bedrock (no use-case form), the same model the ai-service uses
    model-id: ${ASSISTANT_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
    max-tokens: 400
    timeout: 20s
    # every question is a paid call: at most 20 per account every 10 minutes
    max-questions: 20
    question-window: 10m
    # the note the assistant writes about an alert on its own, with no question (AlertNoteService)
    alert-note-language: ${ASSISTANT_ALERT_NOTE_LANGUAGE:es}
