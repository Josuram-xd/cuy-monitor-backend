name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # contextLoads needs a real Postgres; same image and credentials as infra/docker-compose.dev.yml
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cuymonitor
          POSTGRES_USER: cuymonitor
          POSTGRES_PASSWORD: cuymonitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuymonitor -d cuymonitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # the schema lives in its own repo (ADR-008); the tests run against it
      - uses: actions/checkout@v4
        with:
          repository: Josuram-xd/cuy-monitor-db
          ref: main
          path: cuy-monitor-db

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply database migrations
        run: |
          docker run --rm --network host             -v "${{ github.workspace }}/cuy-monitor-db/migrations:/flyway/sql:ro"             flyway/flyway:11.20.3-alpine             -url=jdbc:postgresql://localhost:5432/cuymonitor -user=cuymonitor -password=cuymonitor             -locations=filesystem:/flyway/sql migrate

      # test-only value; the real secret lives in infra/.env on the EC2
      - name: Build and test
        env:
          APP_JWT_SECRET: ci-only-secret-with-at-least-32-bytes!!
        run: ./mvnw -B verify

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
