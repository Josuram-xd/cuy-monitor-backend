# Local development: only Postgres, with its port open to your machine.
# Run the backend itself from the IDE or with ./mvnw spring-boot:run
# Start:  docker compose -f infra/docker-compose.dev.yml up -d
name: cuy-monitor-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cuymonitor
      POSTGRES_USER: cuymonitor
      POSTGRES_PASSWORD: cuymonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql

volumes:
  pgdata-dev:
