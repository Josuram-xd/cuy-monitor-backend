# Local development: only Postgres and Kafka, with ports open to your machine.
# Run the backend itself from the IDE or with ./mvnw spring-boot:run
# Start:  docker compose -f infra/docker-compose.dev.yml up -d
name: cuy-monitor-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cuymonitor
      POSTGRES_USER: cuymonitor
      POSTGRES_PASSWORD: cuymonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"

volumes:
  pgdata-dev:
