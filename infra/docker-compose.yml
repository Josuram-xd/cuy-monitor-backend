# Production stack for the EC2 instance.
# Run from this folder:  docker compose up -d --build --remove-orphans
name: cuy-monitor

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/18/docker,
      # so the volume goes on /var/lib/postgresql (NOT .../data like in older versions)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
    image: cuy-monitor-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_API_KEY: ${API_KEY}
      JAVA_OPTS: "-Xms256m -Xmx384m"
    # No ports published: only reachable through Caddy

  # Starts only with:  docker compose --profile ai up -d --build
  # Needs cuy-monitor-ai-service cloned next to cuy-monitor-backend.
  # Sends its results to the backend over the internal Docker network.
  ai-service:
    profiles: ["ai"]
    build:
      context: ../../cuy-monitor-ai-service
    image: cuy-monitor-ai-service:local
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      API_KEY: ${API_KEY}

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
