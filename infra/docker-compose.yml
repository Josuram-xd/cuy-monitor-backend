# Production stack for the EC2 instance.
# Run from this folder:  docker compose up -d --build --remove-orphans
# The database is Amazon RDS (private, same VPC); there is no Postgres container.
name: cuy-monitor

services:
  # Applies cuy-monitor-db migrations to RDS once and exits (ADR-008).
  # Needs cuy-monitor-db cloned next to cuy-monitor-backend.
  migrate:
    build:
      context: ../../cuy-monitor-db
    image: cuy-monitor-db-migrate:local
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  backend:
    build:
      context: ..
    image: cuy-monitor-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # application-prod.yml: TLS on the JDBC connection
      SPRING_PROFILES_ACTIVE: prod
      # RDS endpoint and credentials (password from Secrets Manager)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_API_KEY: ${API_KEY}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      JAVA_OPTS: "-Xms256m -Xmx384m"
    # No ports published: only reachable through Caddy

  # Static build of the SPA served by its own Caddy on port 80.
  # Needs cuy-monitor-dashboard cloned next to cuy-monitor-backend.
  dashboard:
    build:
      context: ../../cuy-monitor-dashboard
      args:
        VITE_USE_MOCKS: "false"
    image: cuy-monitor-dashboard:local
    restart: unless-stopped
    # No ports published: only reachable through Caddy

  # Starts only with:  docker compose --profile ai up -d --build
  # Needs cuy-monitor-ai-service cloned next to cuy-monitor-backend.
  # Sends its results to the backend over the internal Docker network.
  ai-service:
    profiles: ["ai"]
    build:
      context: ../../cuy-monitor-ai-service
    image: cuy-monitor-ai-service:local
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      API_KEY: ${API_KEY}

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - backend
      - dashboard
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
